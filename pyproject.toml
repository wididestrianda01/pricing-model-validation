[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricing"
version = "0.1.0"
description = "Numerical pricing and independent model-validation core"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "QuantLib-Python>=1.18",
    "numba>=0.67.0",
    "jax>=0.11.1",
    "pyarrow>=15",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8",
]
fetch = [
    "yfinance>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: offline tests over committed data artifacts"]
